[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "native-ai-lifeforms"
version = "0.1.0"
description = "Autonomous NPC architecture: BDI agents, goal graphs, multi-agent negotiation, and event-driven replanning. No LLM required on the critical path."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "native-ai-lifeforms contributors" }
]
keywords = ["game-ai", "npc", "bdi", "multi-agent", "goap", "htn", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
native-life-demo = "native_life.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
